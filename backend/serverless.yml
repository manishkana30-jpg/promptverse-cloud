service: promptverse-worker

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  memorySize: 3072 # 3GB minimum memory for heavy FFmpeg processing
  timeout: 900 # Maximum Lambda timeout (15 minutes)
  ephemeralStorageSize: 10240 # Maximize /tmp limit to 10GB for downloading 30 high-res video scenes
  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - "s3:PutObject"
          Resource: "arn:aws:s3:::promptverse-bucket/*"
  environment:
    SUPABASE_URL: ${env:SUPABASE_URL}
    SUPABASE_SERVICE_ROLE_KEY: ${env:SUPABASE_SERVICE_ROLE_KEY}

functions:
  postProductionWorker:
    handler: dist/worker/postProduction.handler # Assuming a Lambda wrapper is exported here
    events:
      - httpApi:
          path: /api/worker/start
          method: post

layers:
  # Using a public FFmpeg layer for AWS Lambda
  - arn:aws:lambda:us-east-1:175033217214:layer:graphicsmagick:2
